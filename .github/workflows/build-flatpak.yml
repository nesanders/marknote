name: Build Flatpak

on:
  push:
    branches:
      - master
      - ci/flatpak-build
      - ci/flatpak-master
      - 'feature/**'
  workflow_dispatch: {}

jobs:
  flatpak-build:
    name: Build marknote.flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder jq

      - name: Read runtime version from manifest
        id: manifest
        run: |
          echo "runtime_version=$(jq -r '."runtime-version"' .flatpak-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install KDE SDK and Platform runtimes
        env:
          RV: ${{ steps.manifest.outputs.runtime_version }}
        run: |
          # Flathub's CDN occasionally times out on summary shards; retry before failing.
          for attempt in 1 2 3; do
            flatpak install --user -y --noninteractive flathub "org.kde.Sdk//$RV" "org.kde.Platform//$RV" && exit 0
            echo "Runtime install attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Build with flatpak-builder and export to repo
        run: |
          flatpak-builder --user --force-clean \
            --state-dir=.flatpak-builder \
            --repo=flatpak-repo \
            build-dir .flatpak-manifest.json

      - name: Build single-file bundle
        run: |
          flatpak build-bundle flatpak-repo marknote.flatpak io.github.nesanders.marknote

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: marknote-flatpak
          path: marknote.flatpak
          if-no-files-found: error

      # ---- Flatpak repository, so installs update with `flatpak update` ----
      # Signed with the key in the FLATPAK_GPG_PRIVATE_KEY secret (never in the
      # repository). The "Web app (GitHub Pages)" workflow publishes it at
      # https://<owner>.github.io/<repo>/flatpak/. Branches without the secret
      # use a throwaway key, only to check that this part works.
      - name: Sign the repository and write the install files
        id: repo
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          IS_MASTER: ${{ github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          sudo apt-get install -y ostree
          export GNUPGHOME="$(mktemp -d)"
          if [ -n "$GPG_KEY" ]; then
            # Accept the armored key as pasted (also with CRLF line ends or
            # indentation), or base64 of it / of a binary export.
            printf '%s\n' "$GPG_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//' > "$GNUPGHOME/key.in"
            if ! gpg --batch --import "$GNUPGHOME/key.in" 2>/dev/null \
              && ! { base64 -d "$GNUPGHOME/key.in" > "$GNUPGHOME/key.bin" 2>/dev/null && gpg --batch --import "$GNUPGHOME/key.bin" 2>/dev/null; }; then
              # Describe what the secret looks like, without revealing it.
              echo "::error::FLATPAK_GPG_PRIVATE_KEY is not a usable GPG key."
              echo "Lines: $(wc -l < "$GNUPGHOME/key.in"), characters: $(wc -c < "$GNUPGHOME/key.in")"
              grep -q 'BEGIN PGP PRIVATE KEY BLOCK' "$GNUPGHOME/key.in" && echo "Has a 'BEGIN PGP PRIVATE KEY BLOCK' line." || echo "No 'BEGIN PGP PRIVATE KEY BLOCK' line."
              grep -q 'END PGP PRIVATE KEY BLOCK' "$GNUPGHOME/key.in" && echo "Has an 'END PGP PRIVATE KEY BLOCK' line." || echo "No 'END PGP PRIVATE KEY BLOCK' line (cut off?)."
              grep -q 'BEGIN PGP PUBLIC KEY BLOCK' "$GNUPGHOME/key.in" && echo "Looks like a PUBLIC key: the secret needs the private key (gpg --armor --export-secret-keys)."
              exit 1
            fi
            if ! gpg --list-secret-keys --with-colons | grep -q '^sec'; then
              echo "::error::FLATPAK_GPG_PRIVATE_KEY holds only a public key; export it with gpg --armor --export-secret-keys."
              exit 1
            fi
          elif [ "$IS_MASTER" = true ]; then
            echo "::warning::No FLATPAK_GPG_PRIVATE_KEY secret: the Flatpak repository is not published. See README › Installing this fork."
            exit 0
          else
            gpg --batch --passphrase '' --quick-gen-key "Marknote CI throwaway <ci@invalid>" ed25519 sign 1d
          fi
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          APP=io.github.nesanders.marknote

          # Debug symbols are large and not needed for updates.
          for ref in $(ostree refs --repo=flatpak-repo | grep '\.Debug/' || true); do
            ostree refs --repo=flatpak-repo --delete "$ref"
          done
          flatpak build-sign flatpak-repo "$APP" master --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME"
          for ref in $(ostree refs --repo=flatpak-repo | grep "^app/$APP\.Locale/\|^runtime/$APP\.Locale/" || true); do
            flatpak build-sign flatpak-repo "$(echo "$ref" | cut -d/ -f2)" master --runtime --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME"
          done
          flatpak build-update-repo flatpak-repo --prune --default-branch=master \
            --title="Marknote (${GITHUB_REPOSITORY_OWNER})" \
            --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME"

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BASE="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}/flatpak"
          KEY=$(gpg --export "$KEY_ID" | base64 -w0)
          mkdir -p site/flatpak
          mv flatpak-repo site/flatpak/repo
          printf '%s\n' "[Flatpak Repo]" "Title=Marknote (${GITHUB_REPOSITORY_OWNER})" "Url=${BASE}/repo/" \
            "Homepage=https://github.com/${GITHUB_REPOSITORY}" "Comment=Builds of this Marknote fork" \
            "GPGKey=${KEY}" "RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo" \
            > site/flatpak/marknote.flatpakrepo
          printf '%s\n' "[Flatpak Ref]" "Name=${APP}" "Branch=master" "Title=Marknote (${GITHUB_REPOSITORY_OWNER})" \
            "Url=${BASE}/repo/" "SuggestRemoteName=marknote" "IsRuntime=false" "GPGKey=${KEY}" \
            "RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo" \
            > site/flatpak/marknote.flatpakref
          du -sh site/flatpak
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check the repository is installable
        if: steps.repo.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # A fresh user installation, as a person would set it up.
          export FLATPAK_USER_DIR="$(mktemp -d)"
          flatpak remote-add --user --from check site/flatpak/marknote.flatpakrepo
          # Serve the files over HTTP like GitHub Pages does.
          (cd site && python3 -m http.server 8099 >/dev/null 2>&1 &)
          sleep 2
          flatpak remote-modify --user check --url=http://127.0.0.1:8099/flatpak/repo/
          flatpak remote-ls --user check
          flatpak remote-ls --user check | grep -q io.github.nesanders.marknote

      - name: Upload the repository for GitHub Pages
        if: steps.repo.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marknote-flatpak-repo
          path: site
          if-no-files-found: error
          retention-days: 90
