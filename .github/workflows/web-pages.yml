name: Web app (GitHub Pages)

on:
  push:
    branches: [master, feature/pwa]
    paths: ['web/**', '.github/workflows/web-pages.yml']
  pull_request:
    paths: ['web/**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The site is public: make sure no OAuth client or token ended up in it.
      - name: Check the built site for secrets
        run: |
          if grep -rEn '[0-9]+-[a-z0-9]{20,}\.apps\.googleusercontent\.com|GOCSPX-|ya29\.' dist; then
            echo "OAuth client or token found in the build"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    # Needs Settings > Pages > Source: GitHub Actions. Deploying from a branch
    # other than the default one also needs that branch allowed in
    # Settings > Environments > github-pages.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
